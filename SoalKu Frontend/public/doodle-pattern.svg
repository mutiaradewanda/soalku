<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <defs>
    <style>
      .doodle {
        stroke: #739071;
        fill: none;
        stroke-width: 1.4;
        stroke-linecap: round;
        stroke-linejoin: round;
        opacity: 0.18;
      }
      .sparkle {
        fill: #84A282;
        opacity: 0.22;
      }
    </style>
  </defs>
  
  <!-- 1. Pencil (Top Left) -->
  <g class="doodle" transform="translate(35, 25) rotate(40)">
    <polygon points="0,0 8,0 8,30 4,36 0,30" />
    <line x1="0" y1="8" x2="8" y2="8" />
    <line x1="0" y1="30" x2="8" y2="30" />
    <line x1="4" y1="8" x2="4" y2="30" />
  </g>

  <!-- 2. Star Sparkle 4-point -->
  <path class="sparkle" d="M110,25 Q110,35 120,35 Q110,35 110,45 Q110,35 100,35 Q110,35 110,25 Z" />

  <!-- 3. Math Plus & Equals -->
  <g class="doodle" transform="translate(170, 30)">
    <line x1="0" y1="6" x2="12" y2="6" />
    <line x1="6" y1="0" x2="6" y2="12" />
  </g>
  <g class="doodle" transform="translate(205, 33)">
    <line x1="0" y1="0" x2="12" y2="0" />
    <line x1="0" y1="6" x2="12" y2="6" />
  </g>

  <!-- 4. Open Book (Top Right) -->
  <g class="doodle" transform="translate(250, 25)">
    <path d="M0,18 Q12,12 24,18 Q36,12 48,18 L48,32 Q36,26 24,32 Q12,26 0,32 Z" />
    <line x1="24" y1="18" x2="24" y2="32" />
    <line x1="6" y1="22" x2="18" y2="20" />
    <line x1="6" y1="26" x2="18" y2="24" />
    <line x1="30" y1="20" x2="42" y2="22" />
    <line x1="30" y1="24" x2="42" y2="26" />
  </g>

  <!-- 5. Lightbulb (Middle Left) -->
  <g class="doodle" transform="translate(25, 100)">
    <path d="M10,0 C4,0 0,5 0,10 C0,14 3,17 5,20 L5,24 L15,24 L15,20 C17,17 20,14 20,10 C20,5 16,0 10,0 Z" />
    <line x1="6" y1="27" x2="14" y2="27" />
    <line x1="8" y1="30" x2="12" y2="30" />
    <line x1="8" y1="12" x2="12" y2="12" />
  </g>

  <!-- 6. Math Pi Symbol -->
  <g class="doodle" transform="translate(85, 115)">
    <line x1="0" y1="0" x2="18" y2="0" />
    <path d="M5,0 Q4,10 3,16" />
    <path d="M13,0 L13,14 Q13,16 16,16" />
  </g>

  <!-- 7. Ruler / Triangle Set Square -->
  <g class="doodle" transform="translate(140, 95)">
    <polygon points="0,30 30,30 30,0" />
    <polygon points="8,26 24,26 24,10" />
    <line x1="27" y1="6" x2="30" y2="6" />
    <line x1="27" y1="12" x2="30" y2="12" />
    <line x1="27" y1="18" x2="30" y2="18" />
    <line x1="27" y1="24" x2="30" y2="24" />
  </g>

  <!-- 8. Sparkle 8-point -->
  <path class="sparkle" d="M215,110 Q215,118 223,118 Q215,118 215,126 Q215,118 207,118 Q215,118 215,110 Z" />

  <!-- 9. Math Division Sign -->
  <g class="doodle" transform="translate(270, 110)">
    <circle cx="6" cy="0" r="1.5" fill="#739071" opacity="0.3" />
    <line x1="0" y1="7" x2="12" y2="7" />
    <circle cx="6" cy="14" r="1.5" fill="#739071" opacity="0.3" />
  </g>

  <!-- 10. Math Square Root -->
  <g class="doodle" transform="translate(30, 190)">
    <path d="M0,10 L4,10 L7,18 L12,2 L26,2" />
    <path d="M16,14 L20,8 M20,14 L16,8" stroke-width="1.2" />
  </g>

  <!-- 11. Graduation Cap -->
  <g class="doodle" transform="translate(95, 185)">
    <polygon points="16,0 32,7 16,14 0,7" />
    <path d="M6,10 L6,18 Q16,23 26,18 L26,10" />
    <line x1="28" y1="9" x2="32" y2="18" />
    <circle cx="32" cy="19" r="1.5" fill="#739071" opacity="0.3" />
  </g>

  <!-- 12. Pencil #2 (Angled Down) -->
  <g class="doodle" transform="translate(180, 175) rotate(-35)">
    <polygon points="0,0 7,0 7,26 3.5,32 0,26" />
    <line x1="0" y1="6" x2="7" y2="6" />
    <line x1="0" y1="26" x2="7" y2="26" />
  </g>

  <!-- 13. Notebook / Notepad -->
  <g class="doodle" transform="translate(255, 180)">
    <rect x="4" y="0" width="24" height="30" rx="3" />
    <line x1="10" y1="8" x2="22" y2="8" />
    <line x1="10" y1="14" x2="22" y2="14" />
    <line x1="10" y1="20" x2="18" y2="20" />
    <circle cx="4" cy="6" r="1.5" />
    <circle cx="4" cy="14" r="1.5" />
    <circle cx="4" cy="22" r="1.5" />
  </g>

  <!-- 14. Big Star Sparkle -->
  <path class="sparkle" d="M45,265 Q45,277 57,277 Q45,277 45,289 Q45,277 33,277 Q45,277 45,265 Z" />

  <!-- 15. Lightbulb #2 -->
  <g class="doodle" transform="translate(125, 255) rotate(15)">
    <path d="M8,0 C3,0 0,4 0,8 C0,11 2,13 4,16 L4,19 L12,19 L12,16 C14,13 16,11 16,8 C16,4 13,0 8,0 Z" />
    <line x1="5" y1="21" x2="11" y2="21" />
  </g>

  <!-- 16. Compass / Triangle Angle -->
  <g class="doodle" transform="translate(200, 260)">
    <path d="M0,22 L10,2 L20,22" />
    <path d="M4,15 Q10,12 16,15" />
  </g>

  <!-- 17. Math Multiplication & Sparkle -->
  <g class="doodle" transform="translate(265, 265)">
    <line x1="2" y1="2" x2="10" y2="10" />
    <line x1="10" y1="2" x2="2" y2="10" />
  </g>
  <path class="sparkle" d="M295,260 Q295,266 301,266 Q295,266 295,272 Q295,266 289,266 Q295,266 295,260 Z" />
</svg>
